# One entry per scored condition. backend: bosun (native decision readout) | mcq (lettered options, any chat LM).
# Fine-tuned decision heads may put ~0 mass on letters (Bosun does); runs warn on low option_mass.
# `base` names the condition holding the underlying LLM, so analysis can pair decision model ↔ base.
bosun-v3.1:
  backend: bosun
  path: ~/Desktop/my_repos/network_agents/models/bosun-v3.1-1.7b
  base: qwen3-1.7b
bosun-v3.1-adapter-off: # sanity check: should reproduce qwen3-1.7b exactly
  backend: mcq
  loader: bosun
  adapter: "off"
  path: ~/Desktop/my_repos/network_agents/models/bosun-v3.1-1.7b
  chat_kwargs: {enable_thinking: false}
qwen3-1.7b:
  backend: mcq
  path: Qwen/Qwen3-1.7B
  revision: 70d244cc86ccca08cf5af4e1e306ecf908b1ad5e  # Bosun's pinned base revision
  local_files_only: true
  chat_kwargs: {enable_thinking: false}
bosun-v3.1-0.6b:
  backend: bosun
  path: ~/.cache/huggingface/hub/models--Hanno-Labs--bosun-v3.1-0.6b/snapshots/5e78a37c8d86860ebac9ef2d5327d6299498498e
  base: qwen3-0.6b
bosun-v3.1-0.6b-adapter-off: # sanity check: should reproduce qwen3-0.6b exactly
  backend: mcq
  loader: bosun
  adapter: "off"
  path: ~/.cache/huggingface/hub/models--Hanno-Labs--bosun-v3.1-0.6b/snapshots/5e78a37c8d86860ebac9ef2d5327d6299498498e
  chat_kwargs: {enable_thinking: false}
qwen3-0.6b:
  backend: mcq
  path: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca  # Bosun-0.6B's pinned base revision
  local_files_only: true
  chat_kwargs: {enable_thinking: false}
kev-0.6b:  # pointer-head decision model; scored in-process with vendor/kev exactly as kev.serve does
  backend: kev
  path: ~/.cache/huggingface/hub/models--jaredpalmer--kev-0.6b/snapshots/dece6dba8d43f0f7ded45e9f5b9df12474d90843
  base: qwen3-0.6b-base
qwen3-0.6b-base:  # pre-trained base (no chat tuning): plain "Answer:" prompt
  backend: mcq
  chat: false
  path: Qwen/Qwen3-0.6B-Base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd  # kev-0.6b's head.pt base_revision
  local_files_only: true
