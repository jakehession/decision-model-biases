[project]
name = "dbias"
version = "0.1.0"
description = "Bias study: decision models vs their base LLMs"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.16.0",
    "datasets>=5.2.0",
    "pandas>=3.1.1",
    "peft>=0.22.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "safetensors>=0.8.0",
    "scipy>=1.18.1",
    "torch>=2.15.0",
    "transformers>=4.57",
    "typer>=0.29.2",
]

[tool.uv]
package = false
